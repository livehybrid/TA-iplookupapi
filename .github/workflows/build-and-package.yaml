name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
permissions:
  pull-requests: write
  actions: write
  checks: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.0.0
          rm -rf stage && mkdir -p stage
          cp -r output/TA-iplookupapi stage/TA-iplookupapi
          # Point the command at the mock freeipapi via the app-local override
          # file (search-command processes do not reliably inherit the env var).
          mkdir -p stage/TA-iplookupapi/local
          echo "http://mock:8080" > stage/TA-iplookupapi/local/freeipapi_base
          chmod -R 777 stage/TA-iplookupapi

      - name: Start Splunk (wait for health)
        working-directory: docker
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_iplookupapi_splunk
        run: pytest tests/ -v -ra

      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec ta_iplookupapi_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*iplookupapi* OR component=ChunkedExternProcessor OR component=SearchProcessor) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true
          docker compose logs --tail 40 mock || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main